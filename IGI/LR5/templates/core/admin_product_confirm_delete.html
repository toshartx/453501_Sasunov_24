{% extends 'base.html' %}

{% block title %}Удалить товар{% endblock %}

{% block content %}
<h1>Удалить товар</h1>

<p>Вы уверены, что хотите удалить товар <strong>{{ product.name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'core:admin_products' %}">Отмена</a>
</form>
{% endblock %}
