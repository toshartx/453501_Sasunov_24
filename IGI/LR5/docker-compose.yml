services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: confectionery_db
      POSTGRES_USER: confectionery_user
      POSTGRES_PASSWORD: confectionery_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confectionery_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEBUG=1
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_NAME=confectionery_db
      - DB_USER=confectionery_user
      - DB_PASSWORD=confectionery_pass
      - DB_HOST=db
      - DB_PORT=5432
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./media:/app/media
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data: